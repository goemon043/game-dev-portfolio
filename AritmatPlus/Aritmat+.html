<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARITMAT+ - Aventura Matemática</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Press Start 2P', monospace;
        }
        
        #game-container {
            position: relative;
            width: 1200px;
            height: 800px;
            background-image: url('assets/fondo.png');
            background-size: cover;
            background-position: center;
            border: 5px solid #2c3e50;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            overflow: hidden;
        }
        
        #overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.15);
            pointer-events: none;
            z-index: 1;
        }
        
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            color: #fff;
            z-index: 10;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000;
        }
        
        #question-box {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(to bottom, #f39c12, #e67e22);
            padding: 25px 50px;
            border: 5px solid #d35400;
            border-radius: 15px;
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 8px 0 #a04000, 0 10px 20px rgba(0,0,0,0.5);
            min-width: 350px;
            text-align: center;
            z-index: 10;
            text-shadow: 3px 3px 0 #000;
        }
        
        #player {
            position: absolute;
            bottom: 80px;
            left: 80px;
            width: 160px;  /* Más ancho */
            height: 140px;
            z-index: 5;
            filter: drop-shadow(4px 4px 3px rgba(0,0,0,0.7));
            transition: left 0.4s ease-out, bottom 0.4s ease-out;
        }
        
        #player img {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        
        .platform {
            position: absolute;
            width: 180px;
            height: 70px;
            background-image: url('assets/plataforma.png');
            background-size: cover;
            background-position: center;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
            font-size: 28px;
            z-index: 4;
            text-shadow: 3px 3px 0 #000;
            transition: transform 0.1s;
        }
        
        .platform:hover {
            transform: scale(1.08) translateY(-3px);
        }
        
        .platform.correct {
            filter: brightness(1.3) hue-rotate(90deg);
        }
        
        .platform.wrong {
            filter: brightness(1.3) hue-rotate(-90deg);
        }
        
        #feedback {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 64px;
            font-weight: bold;
            display: none;
            text-shadow: 5px 5px 0 #000;
            z-index: 20;
            animation: popIn 0.4s;
        }
        
        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); }
            70% { transform: translate(-50%, -50%) scale(1.3); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        
        #end-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            color: white;
            padding: 40px;
        }
        
        #end-screen h1 {
            font-size: 42px;
            margin-bottom: 30px;
            color: #f1c40f;
            text-shadow: 4px 4px 0 #000;
            text-align: center;
        }
        
        #end-screen h2 {
            font-size: 28px;
            margin-bottom: 30px;
            text-shadow: 3px 3px 0 #000;
        }
        
        #end-screen p {
            font-size: 18px;
            margin-bottom: 40px;
            text-align: center;
            line-height: 1.8;
            max-width: 600px;
        }
        
        #princess-img {
            width: 160px;
            height: 200px;
            margin-bottom: 30px;
            animation: float 2s ease-in-out infinite;
        }
        
        #princess-img img {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        button {
            padding: 20px 40px;
            font-size: 18px;
            font-family: 'Press Start 2P', monospace;
            cursor: pointer;
            background: linear-gradient(to bottom, #27ae60, #1e8449);
            color: white;
            border: 4px solid #145a32;
            border-radius: 10px;
            box-shadow: 0 6px 0 #0e3d22;
            transition: all 0.1s;
        }
        
        button:hover { transform: translateY(-2px); }
        button:active { transform: translateY(4px); box-shadow: 0 2px 0 #0e3d22; }
        
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(to bottom, #27ae60, #145a32);
            border-top: 5px solid #0e3d22;
            z-index: 3;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="overlay"></div>
        
        <div id="ui-layer">
            <span id="score-display">⭐ Puntaje: 0/10</span>
            <span id="level-display">📜 Pregunta: 1/10</span>
        </div>
        
        <div id="question-box">¡Presiona una respuesta!</div>
        
        <div id="player">
            <img src="assets/caballero.png" alt="Caballero">
        </div>
        
        <div id="feedback"></div>
        
        <div class="ground"></div>

        <div id="end-screen">
            <div id="princess-img">
                <img src="assets/princesa.png" alt="Princesa">
            </div>
            <h1 id="final-title">¡JUEGO COMPLETADO!</h1>
            <h2 id="final-score">Tu puntuación: 0/10</h2>
            <p id="final-msg"></p>
            <button onclick="restartGame()">🔄 Jugar de nuevo</button>
        </div>
    </div>

    <script>
        const totalQuestions = 10;
        let currentQuestion = 0;
        let score = 0;
        let questions = [];
        
        const player = document.getElementById('player');
        const questionBox = document.getElementById('question-box');
        const scoreDisplay = document.getElementById('score-display');
        const levelDisplay = document.getElementById('level-display');
        const feedback = document.getElementById('feedback');
        const endScreen = document.getElementById('end-screen');
        const finalScore = document.getElementById('final-score');
        const finalMsg = document.getElementById('final-msg');
        const container = document.getElementById('game-container');

        function generateQuestions() {
            questions = [];
            for(let i=0; i<totalQuestions; i++) {
                const ops = ['+', '-', '*', '/'];
                const op = ops[Math.floor(Math.random() * ops.length)];
                let n1, n2, ans;
                
                if(op === '+') { n1 = Math.floor(Math.random()*50)+1; n2 = Math.floor(Math.random()*50)+1; ans = n1+n2; }
                else if(op === '-') { n1 = Math.floor(Math.random()*50)+10; n2 = Math.floor(Math.random()*n1); ans = n1-n2; }
                else if(op === '*') { n1 = Math.floor(Math.random()*12)+1; n2 = Math.floor(Math.random()*12)+1; ans = n1*n2; }
                else { n2 = Math.floor(Math.random()*12)+1; ans = Math.floor(Math.random()*12)+1; n1 = n2*ans; }

                let options = [ans];
                while(options.length < 4) {
                    let fake = ans + Math.floor(Math.random()*10) - 5;
                    if(fake !== ans && !options.includes(fake) && fake >= 0) options.push(fake);
                }
                options.sort(() => Math.random() - 0.5);

                questions.push({ q: `${n1} ${op} ${n2} = ?`, a: ans, opts: options });
            }
        }

        function loadLevel() {
            if(currentQuestion >= totalQuestions) {
                showEndScreen();
                return;
            }

            const q = questions[currentQuestion];
            questionBox.innerText = q.q;
            levelDisplay.innerText = ` Pregunta: ${currentQuestion + 1}/10`;
            
            document.querySelectorAll('.platform').forEach(e => e.remove());

            player.style.left = '80px';
            player.style.bottom = '80px';

            // PLATAFORMAS MOVIDAS MÁS A LA DERECHA
            const positions = [
                {left: '400px', bottom: '220px'},   // Arriba izquierda
                {left: '750px', bottom: '220px'},   // Arriba derecha
                {left: '400px', bottom: '400px'},   // Abajo izquierda
                {left: '750px', bottom: '400px'}    // Abajo derecha
            ];

            q.opts.forEach((opt, index) => {
                const plat = document.createElement('div');
                plat.className = 'platform';
                plat.innerText = opt;
                plat.style.left = positions[index].left;
                plat.style.bottom = positions[index].bottom;
                
                plat.onclick = () => checkAnswer(opt, q.a, plat);
                container.appendChild(plat);
            });
        }

        function checkAnswer(selected, correct, element) {
            document.querySelectorAll('.platform').forEach(p => p.style.pointerEvents = 'none');

            player.style.left = element.style.left;
            player.style.bottom = parseInt(element.style.bottom) + 80 + 'px';

            if(selected === correct) {
                score++;
                scoreDisplay.innerText = `⭐ Puntaje: ${score}/10`;
                showFeedback("✅ ¡CORRECTO!", "#27ae60");
                element.classList.add('correct');
            } else {
                showFeedback("❌ INCORRECTO", "#e74c3c");
                element.classList.add('wrong');
                setTimeout(() => { player.style.bottom = '80px'; }, 600);
            }

            setTimeout(() => {
                currentQuestion++;
                loadLevel();
            }, 1800);
        }

        function showFeedback(text, color) {
            feedback.innerText = text;
            feedback.style.color = color;
            feedback.style.display = 'block';
            setTimeout(() => { feedback.style.display = 'none'; }, 1200);
        }

        function showEndScreen() {
            endScreen.style.display = 'flex';
            finalScore.innerText = `Tu puntuación final: ${score}/10`;
            
            if(score === 10) {
                finalMsg.innerText = "¡PERFECTO! El caballero ha rescatado a la princesa gracias a tu sabiduría matemática. ¡El reino está a salvo!";
            } else if(score >= 7) {
                finalMsg.innerText = "¡Excelente trabajo! La princesa está impresionada con tus habilidades.";
            } else if(score >= 4) {
                finalMsg.innerText = "Buen intento, pero la princesa aún espera en la torre. ¡Practica más!";
            } else {
                finalMsg.innerText = "El dragón ganó esta vez... ¡Necesitas entrenar más tus matemáticas, caballero!";
            }
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            scoreDisplay.innerText = "⭐ Puntaje: 0/10";
            endScreen.style.display = 'none';
            generateQuestions();
            loadLevel();
        }

        generateQuestions();
        loadLevel();
    </script>
</body>
</html>
